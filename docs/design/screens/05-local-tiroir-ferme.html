<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Mode local · tiroir fermé</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#0b0b0c}
button{font-family:inherit}
.alu{background:repeating-linear-gradient(180deg,rgba(255,255,255,.035) 0 1px,rgba(255,255,255,0) 1px 3px),repeating-linear-gradient(180deg,rgba(0,0,0,.09) 0 1px,rgba(0,0,0,0) 1px 5px),repeating-linear-gradient(180deg,rgba(255,255,255,.025) 0 2px,rgba(255,255,255,0) 2px 13px),linear-gradient(90deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.045) 30%,rgba(255,255,255,0) 55%,rgba(255,255,255,.03) 80%,rgba(255,255,255,0) 100%),linear-gradient(180deg,#3a3b3f 0%,#2f3034 50%,#27282b 100%)}
.walnut{background:repeating-linear-gradient(91deg,rgba(0,0,0,.22) 0 1px,rgba(0,0,0,0) 1px 3px,rgba(255,200,150,.05) 3px 4px,rgba(0,0,0,0) 4px 7px),repeating-linear-gradient(88.5deg,rgba(0,0,0,.18) 0 2px,rgba(0,0,0,0) 2px 11px),linear-gradient(90deg,#22130a 0%,#4a2b18 25%,#5b3720 50%,#432716 75%,#1f1108 100%)}
.led-on{border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff1c9,#ffb547 42%,#d9741a 85%);box-shadow:0 0 6px 2px rgba(255,170,60,.6),0 0 14px rgba(255,140,30,.35)}
.led-off{border-radius:50%;background:radial-gradient(circle at 35% 35%,#5a3d1d,#24170a 75%);box-shadow:inset 0 1px 2px rgba(0,0,0,.8)}
.nixie{position:relative;display:flex;align-items:center;justify-content:center;border-radius:12px 12px 4px 4px;background:repeating-linear-gradient(60deg,rgba(255,255,255,.035) 0 1px,rgba(0,0,0,0) 1px 4px),repeating-linear-gradient(-60deg,rgba(255,255,255,.035) 0 1px,rgba(0,0,0,0) 1px 4px),radial-gradient(ellipse at 50% 40%,rgba(255,130,50,.2),rgba(0,0,0,0) 65%),linear-gradient(180deg,#1b1511,#0a0706);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),inset 3px 4px 6px rgba(255,255,255,.05),0 2px 4px rgba(0,0,0,.7)}
.nx-ghost{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(255,170,100,.07);font-weight:300;line-height:1}
.nx-digit{position:relative;color:#ffb566;font-weight:300;line-height:1;text-shadow:0 0 2px #ffd9a0,0 0 6px #ff7b1c,0 0 14px rgba(255,90,0,.75)}
.beat{animation:beat .484s ease-out infinite}
@keyframes beat{0%{opacity:1}22%{opacity:1}45%{opacity:.12}100%{opacity:.12}}
</style>
</head>
<body>
<div style="width: 844px; height: 390px; position: relative; overflow: hidden; background: #07060f; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; color: #e9dfc7">

<svg width="844" height="390" viewBox="0 0 844 390" preserveAspectRatio="xMidYMid slice" style="position: absolute; left: 0; top: 0; display: block" aria-label="Vidéo générée en plein écran">
<defs>
<radialGradient id="lvBg" cx="62%" cy="62%" r="75%"><stop offset="0" stop-color="#7a2470"></stop><stop offset=".38" stop-color="#321150"></stop><stop offset="1" stop-color="#08061a"></stop></radialGradient>
<linearGradient id="lvSun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe49a"></stop><stop offset=".5" stop-color="#ff963f"></stop><stop offset="1" stop-color="#ec3f7c"></stop></linearGradient>
<radialGradient id="lvGlow"><stop offset="0" stop-color="#ff8a4a" stop-opacity=".55"></stop><stop offset="1" stop-color="#ff8a4a" stop-opacity="0"></stop></radialGradient>
<radialGradient id="lvPlanet" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#9ff5dc"></stop><stop offset=".45" stop-color="#2fb4b0"></stop><stop offset="1" stop-color="#0d2f52"></stop></radialGradient>
<linearGradient id="lvWave" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3b1a8a"></stop><stop offset=".5" stop-color="#b3338f"></stop><stop offset="1" stop-color="#2a1666"></stop></linearGradient>
<mask id="lvBands"><rect width="844" height="390" fill="#fff"></rect><rect x="380" y="214" width="280" height="5" fill="#000"></rect><rect x="380" y="232" width="280" height="8" fill="#000"></rect><rect x="380" y="252" width="280" height="11" fill="#000"></rect><rect x="380" y="276" width="280" height="14" fill="#000"></rect><rect x="380" y="303" width="280" height="30" fill="#000"></rect></mask>
</defs>
<rect width="844" height="390" fill="url(#lvBg)"></rect>
<g fill="#ffffff" opacity=".8"><circle cx="60" cy="40" r="2"></circle><circle cx="120" cy="72" r="1.4"></circle><circle cx="262" cy="30" r="1.8"></circle><circle cx="332" cy="92" r="1.3"></circle><circle cx="402" cy="42" r="2.2"></circle><circle cx="642" cy="50" r="1.5"></circle><circle cx="702" cy="112" r="2"></circle><circle cx="782" cy="40" r="1.3"></circle><circle cx="762" cy="172" r="1.6"></circle><circle cx="90" cy="202" r="1.5"></circle><circle cx="300" cy="212" r="1.3"></circle><circle cx="40" cy="262" r="1.8"></circle><circle cx="820" cy="232" r="1.3"></circle></g>
<circle cx="520" cy="205" r="210" fill="url(#lvGlow)"></circle>
<circle cx="520" cy="205" r="118" fill="url(#lvSun)" mask="url(#lvBands)"></circle>
<ellipse cx="520" cy="215" rx="250" ry="40" fill="none" stroke="#8fe6ff" stroke-width="3" opacity=".6" transform="rotate(-9 520 215)"></ellipse>
<ellipse cx="520" cy="215" rx="290" ry="52" fill="none" stroke="#8fe6ff" stroke-width="1.5" opacity=".28" transform="rotate(-9 520 215)"></ellipse>
<circle cx="190" cy="120" r="46" fill="url(#lvPlanet)"></circle>
<path d="M0 318 C 140 268 290 352 440 306 S 700 262 844 312 L844 390 L0 390 Z" fill="url(#lvWave)" opacity=".85"></path>
<path d="M0 346 C 180 312 320 378 500 340 S 740 318 844 350 L844 390 L0 390 Z" fill="#12082a" opacity=".9"></path>
</svg>
<div style="position: absolute; inset: 0; background: repeating-linear-gradient(180deg, rgba(0,0,0,.12) 0 1px, rgba(0,0,0,0) 1px 3px), radial-gradient(ellipse at center, rgba(0,0,0,0) 60%, rgba(0,0,0,.45) 100%)"></div>

<div style="position: absolute; right: 48px; top: 14px; height: 60px; box-sizing: border-box; padding: 6px 6px 6px 12px; border-radius: 12px; display: flex; align-items: center; gap: 10px; background: rgba(18,18,20,.62); backdrop-filter: blur(10px); box-shadow: inset 0 1px 0 rgba(255,255,255,.1), 0 6px 18px rgba(0,0,0,.45)">
<div style="position: relative; width: 9px; height: 9px">
<div class="led-off" style="position: absolute; inset: 0"></div>
<div class="led-on beat" style="position: absolute; inset: 0"></div>
</div>
<div style="display: flex; gap: 3px">
<div class="nixie" style="width: 22px; height: 32px; font-size: 26px"><span class="nx-ghost">8</span><span class="nx-digit">1</span></div>
<div class="nixie" style="width: 22px; height: 32px; font-size: 26px"><span class="nx-ghost">8</span><span class="nx-digit">2</span></div>
<div class="nixie" style="width: 22px; height: 32px; font-size: 26px"><span class="nx-ghost">8</span><span class="nx-digit">4</span></div>
</div>
<div style="font-size: 10px; font-weight: 600; letter-spacing: .2em; color: #b8ad95">BPM</div>
<button aria-label="Sources vidéo : 3 chargées" style="width: 48px; height: 48px; border: 0; padding: 0; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; background: linear-gradient(180deg,#3f4044,#2a2b2e); box-shadow: 0 2px 0 #121214, 0 4px 6px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.16)">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#e9dfc7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2"></rect><circle cx="8.5" cy="11" r="2"></circle><circle cx="15.5" cy="11" r="2"></circle><path d="M10.5 11h3"></path><path d="M6 19l1.5-3.5h9L18 19"></path></svg>
</button>
<button aria-label="Diffuser vers la TV" style="width: 48px; height: 48px; border: 0; padding: 0; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; background: linear-gradient(180deg,#3f4044,#2a2b2e); box-shadow: 0 2px 0 #121214, 0 4px 6px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.16)">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#e9dfc7" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"></path><path d="M12 14l5 6H7z" fill="#e9dfc7"></path></svg>
</button>
</div>

<button aria-label="Ouvrir la console" style="position: absolute; left: 334px; bottom: 22px; width: 176px; height: 48px; border: 0; padding: 0; border-radius: 10px; overflow: hidden; cursor: pointer; display: flex; font-family: inherit; box-shadow: 0 8px 20px rgba(0,0,0,.55), 0 2px 4px rgba(0,0,0,.6)">
<span class="walnut" style="width: 14px; height: 48px; flex-shrink: 0"></span>
<span class="alu" style="flex-grow: 1; height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; box-shadow: inset 2px 0 3px rgba(0,0,0,.5), inset -2px 0 3px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.16)">
<svg width="18" height="8" viewBox="0 0 18 8" fill="none" stroke="#e9dfc7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 7l7-5 7 5"></path></svg>
<span style="font-size: 11px; font-weight: 600; letter-spacing: .32em; color: #e9dfc7; line-height: 1">CONSOLE</span>
</span>
<span class="walnut" style="width: 14px; height: 48px; flex-shrink: 0"></span>
</button>

</div>
</body>
</html>
