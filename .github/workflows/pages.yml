name: Publier moteur + receiver + catalogue sur GitHub Pages

on:
  push:
    branches: [main]
    paths: ['renderer/**', 'receiver/**', 'catalog/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build renderer
        working-directory: renderer
        run: |
          npm ci
          npm run build
      - name: Build receiver
        working-directory: receiver
        run: |
          npm ci
          npm run build
      - name: Assembler le site
        run: |
          mkdir -p site/renderer site/receiver
          cp -r renderer/dist/. site/renderer/
          cp -r receiver/dist/. site/receiver/
          cp -r catalog site/catalog
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
